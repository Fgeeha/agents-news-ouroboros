[project]
name = "agents-news-ouroboros"
version = "0.1.0"
description = "Новостной конвейер экспертов с независимой проверкой: каждая роль — задача Ouroboros CLI, расписание — cron Ouroboros"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "trafilatura>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agents-news-ouroboros = "agents_news_ouroboros.main:main"
agents-news-ouroboros-report = "agents_news_ouroboros.report:main"
agents-news-ouroboros-bridge = "agents_news_ouroboros.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_news_ouroboros"]

[tool.ruff.lint]
# Осознанные отступления от максимального набора: широкий except Exception
# вокруг сетевых вызовов и наивные даты допустимы в локальном пайплайне.
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
# RUF001-003 ложно срабатывают на кириллицу в русских промптах и комментариях
ignore = ["RUF001", "RUF002", "RUF003"]
