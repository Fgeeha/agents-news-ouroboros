# Конфигурация пайплайна. Имена моделей — алиасы шлюза LiteLLM (make gateway
# поднимает локальный из litellm.config.yaml; по умолчанию — общий стенд):
# код не знает, какая модель за ними стоит, замена модели = правка одного файла шлюза.
gateway:
  base_url: https://litellm.home.arpa/v1
  api_key: sk-local        # заглушка; реальный ключ — LITELLM_API_KEY в .env
  ca_file: certs/litellm.home.arpa.pem   # самоподписанный сертификат шлюза
  timeout: 300

feeds:
  - https://lenta.ru/rss/news
  - https://habr.com/ru/rss/news/
  # Волгоградские источники (проверены 2026-08-17)
  - https://v1.ru/text/rss.xml
  - https://bloknot-volgograd.ru/rss_news.php
  - https://vpravda.ru/rss.xml
  - https://www.volgograd.kp.ru/rss/allsections.xml
  - https://riac34.ru/rss/
  # Государственные источники (проверены 2026-08-17)
  - https://volgoduma.ru/rss/            # Волгоградская областная дума
  - http://kremlin.ru/events/all/feed    # Президент РФ
  - http://government.ru/all/rss/        # Правительство РФ

limit_per_feed: 10
state_file: state/seen.json
output_dir: out

models:
  gate: local-fast         # дешёвая модель — фильтр «относится ли новость к теме»
  reviewer: mistral-nemo:12b   # ДРУГОЕ семейство моделей — независимая проверка
  embed: local-embed       # эмбеддинги для поиска дублей между сайтами

experts:
  - name: agro
    title: Эксперт по агрономии
    domain: >-
      сельское хозяйство, агрономия, растениеводство, животноводство,
      удобрения, урожай, агротехника, продовольственная безопасность
    model: local-reason
  - name: it
    title: Эксперт по информационным технологиям
    domain: >-
      IT, программное обеспечение, интернет, кибербезопасность,
      искусственный интеллект, гаджеты, телеком, стартапы
    model: local-reason
  - name: health
    title: Эксперт по медицине и здоровью
    domain: >-
      медицина, здоровье, фармацевтика, эпидемиология, здравоохранение,
      питание, спорт и физическая активность, психология
    model: local-reason
  - name: economy
    title: Эксперт по экономике и финансам
    domain: >-
      экономика, финансы, банки, инвестиции, налоги, инфляция, курсы валют,
      бюджет, малый и средний бизнес, торговля, рынок труда
    model: local-reason
  - name: law
    title: Эксперт по праву и госуправлению
    domain: >-
      законодательство, суды, госуправление, регулирование, права граждан,
      госуслуги, контрольно-надзорная деятельность, местное самоуправление
    model: local-reason
  - name: education
    title: Эксперт по образованию и науке
    domain: >-
      школы, вузы, ЕГЭ, педагогика, наука, гранты, исследования,
      профессиональное обучение, детские сады, просвещение
    model: local-reason
  - name: construction
    title: Эксперт по строительству и недвижимости
    domain: >-
      строительство, недвижимость, ипотека, ЖКХ, благоустройство,
      градостроительство, инфраструктура, капитальный ремонт, архитектура
    model: local-reason
  - name: energy
    title: Эксперт по энергетике и промышленности
    domain: >-
      энергетика, нефть и газ, электросети, промышленное производство,
      металлургия, химическая промышленность, машиностроение, импортозамещение
    model: local-reason
  - name: transport
    title: Эксперт по транспорту и логистике
    domain: >-
      транспорт, дороги, общественный транспорт, логистика, грузоперевозки,
      авиация, железные дороги, речной транспорт, безопасность дорожного движения
    model: local-reason
  - name: culture
    title: Эксперт по культуре и туризму
    domain: >-
      культура, театр, кино, музыка, музеи, литература, туризм, фестивали,
      краеведение, досуг, гостиничный бизнес
    model: local-reason
  - name: ecology
    title: Эксперт по экологии и природопользованию
    domain: >-
      экология, климат, охрана природы, водные ресурсы, Волга, отходы и переработка,
      загрязнение воздуха, лесное хозяйство, погода и стихийные бедствия
    model: local-reason
