# Шлюз LiteLLM: алиас -> реальная модель. Пайплайн ходит только по алиасам.
# Запуск: make gateway
model_list:
  - model_name: gate
    litellm_params:
      model: ollama_chat/qwen2.5:7b-instruct
      api_base: http://localhost:11434

  - model_name: expert
    litellm_params:
      model: ollama_chat/qwen2.5:14b-instruct-q4_K_M
      api_base: http://localhost:11434

  # Рецензент намеренно из другого семейства (Gemma, не Qwen),
  # чтобы не «подсуживал» текстам, написанным родственной моделью.
  - model_name: reviewer
    litellm_params:
      model: ollama_chat/gemma2:9b
      api_base: http://localhost:11434

  - model_name: embed
    litellm_params:
      model: ollama/bge-m3
      api_base: http://localhost:11434

litellm_settings:
  drop_params: true

# Аутентификация не включена (локальный шлюз): master_key при необходимости
# задаётся переменной окружения LITELLM_MASTER_KEY, не в этом файле.
